# Эхоподавление WebRTC для Русланы (включается: bash scripts/rk3528/enable_aec.sh).
#
# Всё воспроизведение (голос Русланы, музыка, Bluetooth, DLNA) идёт в "Ruslana speakers (AEC)",
# а Руслана слушает "Ruslana microphone (AEC)" — из записи вычитается то, что играет динамик.
# Так микрофон работает и во время ответа/музыки: можно сказать "стоп" или новую команду.
# Нагрузка — порядка 10–20% одного ядра Cortex-A53.
context.modules = [
    {   name = libpipewire-module-echo-cancel
        args = {
            library.name = aec/libspa-aec-webrtc
            node.latency = 1024/48000
            # шумоподавление и автоусиление WebRTC помогают распознаванию с дальнего расстояния
            aec.args = {
                webrtc.high_pass_filter = true
                webrtc.noise_suppression = true
                webrtc.gain_control = true
                webrtc.extended_filter = true
                webrtc.delay_agnostic = true
            }
            capture.props = { node.name = "irene_aec_capture" node.passive = true }
            source.props  = { node.name = "irene_aec_source" node.description = "Ruslana microphone (AEC)" }
            sink.props    = { node.name = "irene_aec_sink" node.description = "Ruslana speakers (AEC)" }
            playback.props = { node.name = "irene_aec_playback" node.passive = true }
        }
    }
]
