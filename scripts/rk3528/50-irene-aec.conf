# Эхоподавление WebRTC: Ирина лучше слышит своё имя, пока играет музыка.
# Всё воспроизведение идёт в irene_aec_sink, микрофон читается из irene_aec_source.
# Нагружает одно ядро A53 примерно на 10-20%. Включается: install.sh --aec
context.modules = [
    {   name = libpipewire-module-echo-cancel
        args = {
            library.name = aec/libspa-aec-webrtc
            node.latency = 1024/48000
            capture.props = { node.name = "irene_aec_capture" node.passive = true }
            source.props  = { node.name = "irene_aec_source" node.description = "Irene microphone (AEC)" }
            sink.props    = { node.name = "irene_aec_sink" node.description = "Irene speakers (AEC)" }
            playback.props = { node.name = "irene_aec_playback" node.passive = true }
        }
    }
]
