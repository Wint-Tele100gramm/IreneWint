# Snapcast для мультирума Ирины (ставит install.sh в ~/.config/irene/snapserver.conf).
# Потоки: idle — тишина (комнаты без музыки), stream1 и stream2 — две независимые линии музыки.
# Плагин Яндекс Музыки пишет в fifo потока PCM 44100 Гц 16 бит стерео; клиенты ESP32 (прошивка 3.1+) и snapclient
# приставки получают его по TCP 1704 (≈1,4 Мбит/с на комнату). ESP32 без PSRAM сводит его в моно 22050 Гц сам. Управление (кто что слушает, громкость) — JSON-RPC на порту 1705.
# Формат записан в стиле snapserver 0.31 (Debian trixie); 0.35 его тоже понимает (с предупреждениями).

[server]
threads = 2
datadir = @DATADIR@

[stream]
bind_to_address = 0.0.0.0
port = 1704
# idle первым: новые клиенты по умолчанию молчат
source = pipe://@RUNDIR@/idle?name=idle&mode=create
source = pipe://@RUNDIR@/stream1?name=stream1&mode=create
source = pipe://@RUNDIR@/stream2?name=stream2&mode=create
sampleformat = 44100:16:2
codec = pcm
chunk_ms = 20
# задержка музыки: меньше — быстрее «пауза» и «дальше»; если в комнатах прерывается звук — 1000
buffer = 600
send_to_muted = false

[tcp]
enabled = true
bind_to_address = 0.0.0.0
port = 1705

[http]
enabled = false

[logging]
filter = *:warning
