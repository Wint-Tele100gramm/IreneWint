// AirPlay-приёмник: iPhone/iPad/Mac -> Пункт управления -> AirPlay -> "Ирина"
general =
{
    name = "Ирина";
    output_backend = "pa";
    interpolation = "basic";      // дешевле по CPU, чем soxr
    volume_range_db = 50;
};

pa =
{
    application_name = "AirPlay";
};

sessioncontrol =
{
    // пока играет AirPlay — ставим Яндекс Музыку на паузу
    run_this_before_play_begins = "@REPO@/scripts/rk3528/music_pause.sh";
    wait_for_completion = "no";
    allow_session_interruption = "yes";
    session_timeout = 20;
};
