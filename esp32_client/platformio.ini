; Клиент Ирины для комнаты: ESP32 / ESP32-S3 + I2S-микрофон (INMP441) + I2S-усилитель (MAX98357A)
; Сборка и прошивка:  pio run -e esp32dev -t upload   (или -e esp32s3)
; Обновление по Wi-Fi: pio run -e esp32dev_ota -t upload --upload-port irene-kitchen.local

[env]
platform = espressif32@^6.9.0          ; Arduino-ESP32 2.0.x (ESP-IDF 4.4, классический драйвер I2S)
framework = arduino
monitor_speed = 115200
board_build.partitions = min_spiffs.csv ; две OTA-области по ~1.9 МБ
lib_deps =
    links2004/WebSockets@^2.6.1
    tzapu/WiFiManager@^2.0.17
    bblanchon/ArduinoJson@^7.2.0
build_flags =
    -DCORE_DEBUG_LEVEL=1

[env:esp32dev]
board = esp32dev

[env:esp32s3]
board = esp32-s3-devkitc-1

[env:esp32dev_ota]
extends = env:esp32dev
upload_protocol = espota
; upload_flags = --auth=<token из настроек клиента>
